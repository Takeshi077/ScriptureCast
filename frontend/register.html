<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started – ScriptureCast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/auth.css">
    <link rel="icon" href="/frontend/logo.jpeg" type="image/jpeg">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="auth-logo">
                <img src="/frontend/logo.jpeg" alt="ScriptureCast Logo">
                ScriptureCast
            </a>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Start your free trial — no credit card needed</p>
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="name">Church / Name</label>
                    <input id="name" type="text" placeholder="Your Church or Your Name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@church.org" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <div id="auth-error" class="auth-error hidden"></div>
                <button type="submit" class="auth-btn" id="register-btn">Create Account</button>
            </form>
            <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </div>
    <script src="/frontend/js/auth.js"></script>
</body>
</html>
