<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptureCast – Operator Dashboard</title>
    <meta name="description" content="ScriptureCast operator control panel for managing live scripture display.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/dashboard.css?v=2">
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header id="app-header">
        <div id="header-brand">
            <svg id="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6C4 4.9 4.9 4 6 4H26C27.1 4 28 4.9 28 6V22C28 23.1 27.1 24 26 24H18L14 28L10 24H6C4.9 24 4 23.1 4 22V6Z" fill="url(#logoGrad)"/>
                <path d="M10 10H22M10 14H18M10 18H15" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="logoGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#818cf8"/>
                    </linearGradient>
                </defs>
            </svg>
            <span id="brand-name">ScriptureCast</span>
        </div>
        <div id="header-controls">
            <div id="connection-indicator">
                <span id="conn-dot"></span>
                <span id="conn-label">Connecting…</span>
            </div>
            <div id="translation-group">
                <label for="translation-select">Translation</label>
                <select id="translation-select">
                    <option value="KJV">KJV</option>
                    <option value="WEB">WEB</option>
                </select>
            </div>

            <button id="clear-btn" class="btn btn-danger" aria-label="Clear display">
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                Clear Display
            </button>
            <button id="logout-btn" class="btn btn-secondary" aria-label="Sign out" title="Sign out">
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/></svg>
                Sign Out
            </button>
        </div>
    </header>

    <!-- ===== MAIN LAYOUT ===== -->
    <main id="main-grid">

        <!-- ===== LEFT PANEL: Live Transcript ===== -->
        <section id="panel-transcript" aria-labelledby="transcript-heading">
            <div class="panel-header">
                <h2 id="transcript-heading">Live Transcript</h2>
                <div id="mic-controls">
                    <button id="mic-toggle-btn" class="mic-btn" aria-label="Toggle speech recognition" title="Click to start browser-based speech recognition">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    </button>
                    <div id="mic-live-label" class="mic-live-label" aria-label="Microphone is listening">
                        <div class="audio-wave">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="transcript-feed" aria-live="polite">
                <p class="placeholder-text">Waiting for audio input…</p>
            </div>

            <!-- Fallback text input (shown when speech is unavailable) -->
            <div id="text-input-area" class="hidden">
                <textarea id="text-input" placeholder="Type sermon text here (e.g. 'turn to John 3:16')…" rows="2"></textarea>
                <button id="text-send-btn" class="btn btn-primary">Send</button>
            </div>

            <!-- Manual Verse Lookup -->
            <div id="manual-card">
                <h3>Manual Verse Lookup</h3>
                <div id="manual-lookup-form">
                    <input id="manual-input" type="text" placeholder="e.g. Romans 8:28 or Psalm 23:1-3" aria-label="Manual verse reference input">
                    <button id="manual-lookup-btn" class="btn btn-primary" aria-label="Look up and display verse">
                        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd"/></svg>
                        Display
                    </button>
                </div>
                <div id="lookup-preview" class="hidden">
                    <div id="lookup-reference-label"></div>
                    <div id="lookup-text-preview"></div>
                </div>
            </div>
        </section>

        <!-- ===== CENTER PANEL: Detected Verses ===== -->
        <section id="panel-center">

            <!-- Detected References -->
            <div id="candidates-card" class="card">
                <div class="panel-header">
                    <h2>
                        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.396 0 2.698.362 3.805 1.014A7.968 7.968 0 0114 14.5c1.255 0 2.443.29 3.5.804v-10A7.969 7.969 0 0014 4c-1.396 0-2.698.362-3.805 1.014A7.968 7.968 0 009 4.804z"/></svg>
                        Detected References
                    </h2>
                </div>
                <div id="candidates-list">
                    <p class="placeholder-text">Detected verse references will appear here automatically…</p>
                </div>
            </div>

        </section>

        <!-- ===== RIGHT PANEL: Projector Preview ===== -->
        <section id="panel-preview" aria-labelledby="preview-heading">
            <div class="panel-header">
                <h2 id="preview-heading">
                    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                    Projector Preview
                </h2>
                <div id="display-status" class="status-badge status-inactive">
                    <span class="status-dot"></span> Off
                </div>
            </div>

            <!-- Mini projector simulation -->
            <div id="projector-preview-screen">
                <div id="preview-inner">
                    <div id="preview-reference">—</div>
                    <div id="preview-text">Nothing on display</div>
                </div>
            </div>

            <!-- Verse navigation (only visible for multi-verse passages) -->
            <div id="dash-verse-nav" class="hidden">
                <button id="dash-prev-btn" class="dash-nav-btn" aria-label="Previous verse">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span id="dash-verse-position"></span>
                <button id="dash-next-btn" class="dash-nav-btn" aria-label="Next verse">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <!-- Action buttons -->
            <div id="preview-actions">
                <button id="open-screen-btn" class="btn btn-secondary" onclick="window.open('/screen', '_blank')">
                    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></svg>
                    Open Projector Screen
                </button>
            </div>
        </section>

    </main>

    <script src="/frontend/js/dashboard.js?v=5"></script>
</body>
</html>
